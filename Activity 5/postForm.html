<!DOCTYPE html>

<head>
	<meta charset="utf-8">

</head>
<body>
	<h1>Post Request Form</h1>
	<h2>Input</h2>
	<p><b>Instructions:</b> <i>Please fill out the two text boxes.</i></p>
	<div>
		<form>
			<label>Name:
				<input type="text" name="name" id="name" size="20">
			</label>
			<label>Password:

			</label>
			<input type="submit" name="submit" id="submit">
		</form>
	</div>

	<h2>Output</h2>

	<div>
		<span>Name: </span>
		<span id="name_post">-----</span>
		<br />
		<span>Password: </span>
		<span id="password_post">-----</span>
	</div>

	<script type="text/javascript" src="postForm.js"></script>
</body>
